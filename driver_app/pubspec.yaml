name: driver_app
description: "Driver companion app for the Car Rental CMS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_foreground_task: ^11.0.3
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  google_maps_flutter_platform_interface: ^2.17.0

flutter:
  uses-material-design: true
